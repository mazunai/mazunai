<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="330">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;display=swap');
      .term-text {
        font-family: 'Fira Code', 'JetBrains Mono', Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        letter-spacing: 0.3px;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #8b949e;
      }
      .cursor {
        animation: blink 1s step-start infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="1" y="1" width="848" height="328" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Titlebar -->
  <path d="M1 13 C1 6.37 6.37 1 13 1 L837 1 C843.63 1 849 6.37 849 13 L849 38 L1 38 Z" fill="#161b22"/>
  <line x1="1" y1="38" x2="849" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="19.5" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="44" cy="19.5" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="64" cy="19.5" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Title Text -->
  <text x="425" y="24" text-anchor="middle" class="title-text">mazunai@macbook:~ (zsh)</text>

  <!-- Terminal Content -->
  <!-- Line 1 -->
  <text x="25" y="72" class="term-text">
    <tspan fill="#58a6ff" font-weight="600">mazunai@dev</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#f0f6fc">$ </tspan><tspan fill="#ffa657">whoami</tspan>
  </text>
  <!-- Output 1 -->
  <text x="25" y="98" class="term-text" fill="#7ee787">
    ⚡ Maxim — Fullstack &amp; AI Engineer • Autonomous Agents &amp; Modern Web Apps
  </text>

  <!-- Line 2 -->
  <text x="25" y="136" class="term-text">
    <tspan fill="#58a6ff" font-weight="600">mazunai@dev</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#f0f6fc">$ </tspan><tspan fill="#ffa657">cat</tspan> <tspan fill="#f0f6fc">tech_stack.json</tspan>
  </text>
  <!-- Output 2 -->
  <text x="25" y="162" class="term-text" fill="#d2a8ff">
    { "core": ["Python", "FastAPI", "Next.js", "React", "TypeScript", "PostgreSQL", "Docker"] }
  </text>

  <!-- Line 3 -->
  <text x="25" y="200" class="term-text">
    <tspan fill="#58a6ff" font-weight="600">mazunai@dev</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#f0f6fc">$ </tspan><tspan fill="#ffa657">./check_availability.sh</tspan> <tspan fill="#79c0ff">--status</tspan>
  </text>
  <!-- Output 3 -->
  <text x="25" y="226" class="term-text" fill="#3fb950" font-weight="600">
    🟢 STATUS: AVAILABLE FOR FREELANCE &amp; CONTRACT WORK [200 OK]
  </text>

  <!-- Line 4 with animated cursor -->
  <text x="25" y="264" class="term-text">
    <tspan fill="#58a6ff" font-weight="600">mazunai@dev</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#f0f6fc">$ </tspan><tspan fill="#f0f6fc">./hire_me.sh --project=ready</tspan>
  </text>
  <rect x="360" y="250" width="8.5" height="17" fill="#58a6ff" class="cursor"/>
</svg>
