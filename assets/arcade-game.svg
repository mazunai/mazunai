<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .arcade-font {
        font-family: 'Press Start 2P', monospace, monospace;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .hud-title { fill: #ff3366; }
      .hud-val { fill: #ffffff; }
      .hud-dim { fill: #64748b; }
      .hud-cyan { fill: #00f0ff; }
      
      .blink-text {
        animation: blink 0.8s step-start infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      .power-pellet {
        animation: pulse 0.5s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.85); opacity: 0.6; }
        100% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 8px #f59e0b); }
      }

      /* Game Loop Animation (10 seconds total) */
      @keyframes pacmanMove {
        0% { transform: translateX(-50px) scaleX(1); }
        48% { transform: translateX(710px) scaleX(1); }
        50% { transform: translateX(710px) scaleX(-1); }
        98% { transform: translateX(-50px) scaleX(-1); }
        100% { transform: translateX(-50px) scaleX(1); }
      }

      @keyframes blinkyMove {
        0% { transform: translateX(-110px) scaleX(1); }
        48% { transform: translateX(650px) scaleX(1); }
        50% { transform: translateX(650px) scaleX(-1); }
        98% { transform: translateX(-110px) scaleX(-1); }
        100% { transform: translateX(-110px) scaleX(1); }
      }

      @keyframes pinkyMove {
        0% { transform: translateX(-155px) scaleX(1); }
        48% { transform: translateX(605px) scaleX(1); }
        50% { transform: translateX(605px) scaleX(-1); }
        98% { transform: translateX(-155px) scaleX(-1); }
        100% { transform: translateX(-155px) scaleX(1); }
      }

      @keyframes inkyMove {
        0% { transform: translateX(-200px) scaleX(1); }
        48% { transform: translateX(560px) scaleX(1); }
        50% { transform: translateX(560px) scaleX(-1); }
        98% { transform: translateX(-200px) scaleX(-1); }
        100% { transform: translateX(-200px) scaleX(1); }
      }

      @keyframes clydeMove {
        0% { transform: translateX(-245px) scaleX(1); }
        48% { transform: translateX(515px) scaleX(1); }
        50% { transform: translateX(515px) scaleX(-1); }
        98% { transform: translateX(-245px) scaleX(-1); }
        100% { transform: translateX(-245px) scaleX(1); }
      }

      /* Ghost color transformation when Pacman eats Power Pellet */
      @keyframes ghostPanic {
        0%, 48% { fill: inherit; }
        50%, 85% { fill: #1e3a8a; }
        86%, 89% { fill: #f8fafc; }
        90%, 93% { fill: #1e3a8a; }
        94%, 97% { fill: #f8fafc; }
        98%, 100% { fill: inherit; }
      }

      .pacman-runner { animation: pacmanMove 10s linear infinite; }
      .blinky-runner { animation: blinkyMove 10s linear infinite; }
      .pinky-runner  { animation: pinkyMove 10s linear infinite; }
      .inky-runner   { animation: inkyMove 10s linear infinite; }
      .clyde-runner  { animation: clydeMove 10s linear infinite; }
    </style>

    <!-- Scanline Pattern for authentic CRT Arcade feel -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
    </pattern>

    <!-- Reusable Ghost Body Path -->
    <path id="ghost-body" d="M 0 15 A 15 15 0 0 1 30 15 L 30 28 L 26 24 L 22 28 L 18 24 L 15 28 L 12 24 L 8 28 L 4 24 L 0 28 Z"/>
    
    <!-- Ghost Eyes (Normal) -->
    <g id="ghost-eyes-normal">
      <ellipse cx="9" cy="11" rx="4" ry="5" fill="#ffffff"/>
      <ellipse cx="21" cy="11" rx="4" ry="5" fill="#ffffff"/>
      <circle cx="11" cy="11" r="2.2" fill="#0022ff"/>
      <circle cx="23" cy="11" r="2.2" fill="#0022ff"/>
    </g>

    <!-- Ghost Eyes (Scared/Panic) -->
    <g id="ghost-eyes-scared">
      <circle cx="9" cy="12" r="2" fill="#ffb8b8"/>
      <circle cx="21" cy="12" r="2" fill="#ffb8b8"/>
      <path d="M 6 20 Q 9 17 12 20 Q 15 23 18 20 Q 21 17 24 20" stroke="#ffb8b8" stroke-width="1.5" fill="none"/>
    </g>
  </defs>

  <!-- Arcade Screen Bezel -->
  <rect x="2" y="2" width="846" height="256" rx="14" fill="#07090e" stroke="#1e293b" stroke-width="2"/>
  <rect x="4" y="4" width="842" height="252" rx="12" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.5"/>

  <!-- Top Arcade HUD -->
  <g class="arcade-font">
    <text x="35" y="32" class="hud-title blink-text">1UP</text>
    <text x="35" y="48" class="hud-val">25680</text>

    <text x="350" y="32" class="hud-title">HIGH SCORE</text>
    <text x="375" y="48" class="hud-val">99990</text>

    <text x="700" y="32" class="hud-cyan">STAGE</text>
    <text x="700" y="48" class="hud-val">MAZUNAI</text>
  </g>

  <!-- Maze Neon Borders -->
  <g fill="none" stroke="#2563eb" stroke-width="3" opacity="0.8">
    <!-- Top & Bottom Maze Rails -->
    <path d="M 25 72 L 825 72 M 25 200 L 825 200" stroke-linecap="round"/>
    <path d="M 25 64 L 825 64 M 25 208 L 825 208" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Neon Corner Accents -->
    <path d="M 35 100 L 35 172 M 815 100 L 815 172" stroke="#3b82f6" stroke-width="2.5"/>
  </g>

  <!-- Static Maze Pellets (Yellow dots along track) -->
  <g fill="#fbbf24">
    <!-- Row of pellets -->
    <circle cx="70" cy="136" r="3"/>
    <circle cx="110" cy="136" r="3"/>
    <circle cx="150" cy="136" r="3"/>
    <circle cx="190" cy="136" r="3"/>
    <circle cx="230" cy="136" r="3"/>
    <circle cx="270" cy="136" r="3"/>
    <circle cx="310" cy="136" r="3"/>
    <circle cx="350" cy="136" r="3"/>
    <circle cx="390" cy="136" r="3"/>
    <circle cx="430" cy="136" r="3"/>
    <circle cx="470" cy="136" r="3"/>
    <circle cx="510" cy="136" r="3"/>
    <circle cx="550" cy="136" r="3"/>
    <circle cx="590" cy="136" r="3"/>
    <circle cx="630" cy="136" r="3"/>
    <circle cx="670" cy="136" r="3"/>
    <!-- Giant Glowing Power Pellet -->
    <g transform="translate(710, 136)">
      <circle cx="0" cy="0" r="8" fill="#fbbf24" class="power-pellet"/>
    </g>
  </g>

  <!-- ANIMATED SPRITES LAYER -->

  <!-- Pacman Character -->
  <g class="pacman-runner">
    <g transform="translate(0, 136)">
      <!-- Animated Chomping Mouth -->
      <path d="M 0 0 L 17 0 A 17 17 0 0 0 -17 0 Z" fill="#ffd700">
        <animateTransform attributeName="transform" type="rotate" values="0; -38; 0" dur="0.25s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 0 L 17 0 A 17 17 0 1 1 -17 0 Z" fill="#ffd700">
        <animateTransform attributeName="transform" type="rotate" values="0; 38; 0" dur="0.25s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Ghost 1: Blinky (Red) -->
  <g class="blinky-runner">
    <g transform="translate(-15, 121)">
      <use href="#ghost-body" fill="#ff0033" style="animation: ghostPanic 10s infinite;"/>
      <use href="#ghost-eyes-normal"/>
    </g>
  </g>

  <!-- Ghost 2: Pinky (Pink) -->
  <g class="pinky-runner">
    <g transform="translate(-15, 121)">
      <use href="#ghost-body" fill="#ff69b4" style="animation: ghostPanic 10s infinite;"/>
      <use href="#ghost-eyes-normal"/>
    </g>
  </g>

  <!-- Ghost 3: Inky (Cyan) -->
  <g class="inky-runner">
    <g transform="translate(-15, 121)">
      <use href="#ghost-body" fill="#00f0ff" style="animation: ghostPanic 10s infinite;"/>
      <use href="#ghost-eyes-normal"/>
    </g>
  </g>

  <!-- Ghost 4: Clyde (Orange) -->
  <g class="clyde-runner">
    <g transform="translate(-15, 121)">
      <use href="#ghost-body" fill="#ff9900" style="animation: ghostPanic 10s infinite;"/>
      <use href="#ghost-eyes-normal"/>
    </g>
  </g>

  <!-- Bottom Arcade Footer (Lives, Level, Fruits) -->
  <g class="arcade-font" transform="translate(30, 236)">
    <!-- Lives -->
    <text x="0" y="0" class="hud-dim">LIVES</text>
    <circle cx="65" cy="-4" r="6" fill="#ffd700"/>
    <circle cx="83" cy="-4" r="6" fill="#ffd700"/>
    <circle cx="101" cy="-4" r="6" fill="#ffd700"/>

    <!-- Free Play Status -->
    <text x="310" y="0" class="hud-cyan blink-text">INSERT COIN // FREE PLAY</text>

    <!-- Fruits -->
    <text x="710" y="0" font-size="14" fill="#ffffff">🍒 🍓 🍊 🔔 🗝️</text>
  </g>

  <!-- CRT Scanline Overlay -->
  <rect x="0" y="0" width="850" height="260" fill="url(#scanlines)" pointer-events="none"/>
</svg>