<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      .title-text {
        font-family: 'Fira Code', Menlo, Monaco, monospace;
        font-size: 11px;
        letter-spacing: 1.2px;
        font-weight: 700;
        fill: #8b949e;
      }
      .card-title {
        font-family: 'Fira Code', Menlo, Monaco, monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #ffffff;
      }
      .card-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        line-height: 1.4;
        fill: #94a3b8;
      }
      .status-text {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #10b981;
      }
      .pulse-dot {
        animation: pulseDot 1.5s infinite;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="848" height="248" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header Bar -->
  <path d="M 1 13 C 1 6.37 6.37 1 13 1 L 837 1 C 843.63 1 849 6.37 849 13 L 849 38 L 1 38 Z" fill="#161b22"/>
  <line x1="1" y1="38" x2="849" y2="38" stroke="#30363d" stroke-width="1"/>

  <text x="24" y="24" class="title-text">// SHCODING STUDIO: ПРИНЦИПЫ &amp; СКОРОСТЬ РАЗРАБОТКИ</text>
  
  <g transform="translate(660, 24)">
    <circle cx="0" cy="-4" r="4.5" fill="#10b981" class="pulse-dot"/>
    <text x="12" y="0" class="status-text">ОТКРЫТЫ К ЗАКАЗАМ</text>
  </g>

  <!-- 4 Pillars Grid -->
  <!-- Block 1: Скорость запуска -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="385" height="82" rx="8" fill="#161b22" stroke="#1f2937" stroke-width="1"/>
    <text x="16" y="26" class="card-title"><tspan fill="#38bdf8">⚡</tspan> Быстрый запуск MVP (3–7 дней)</text>
    <text x="16" y="48" class="card-desc">От идеи до работающего продакшн-релиза.</text>
    <text x="16" y="66" class="card-desc">Сжатые сроки, итеративная разработка без бюрократии.</text>
  </g>

  <!-- Block 2: AI-ускорение -->
  <g transform="translate(440, 55)">
    <rect x="0" y="0" width="385" height="82" rx="8" fill="#161b22" stroke="#1f2937" stroke-width="1"/>
    <text x="16" y="26" class="card-title"><tspan fill="#a855f7">🤖</tspan> Агентное ускорение кодинга</text>
    <text x="16" y="48" class="card-desc">Используем ИИ-агентов для быстрого прототипирования,</text>
    <text x="16" y="66" class="card-desc">покрытия авто-тестами и рефакторинга в разы быстрее.</text>
  </g>

  <!-- Block 3: Надежный стек -->
  <g transform="translate(25, 148)">
    <rect x="0" y="0" width="385" height="82" rx="8" fill="#161b22" stroke="#1f2937" stroke-width="1"/>
    <text x="16" y="26" class="card-title"><tspan fill="#10b981">🧱</tspan> Надежный стек без оверхеда</text>
    <text x="16" y="48" class="card-desc">FastAPI, Python, Next.js, React, Docker, Postgres.</text>
    <text x="16" y="66" class="card-desc">Чистая архитектура, строгая типизация и масштабируемость.</text>
  </g>

  <!-- Block 4: Прямая связь -->
  <g transform="translate(440, 148)">
    <rect x="0" y="0" width="385" height="82" rx="8" fill="#161b22" stroke="#1f2937" stroke-width="1"/>
    <text x="16" y="26" class="card-title"><tspan fill="#f59e0b">🤝</tspan> Прямой контакт с разработчиком</text>
    <text x="16" y="48" class="card-desc">Никаких посредников и менеджеров. Прямая связь</text>
    <text x="16" y="66" class="card-desc">в Telegram <tspan fill="#38bdf8" font-weight="600">@mazunio</tspan> и прозрачные этапы работы.</text>
  </g>
</svg>