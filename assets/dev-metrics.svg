<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="230">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      .hud-title {
        font-family: 'Fira Code', Menlo, Monaco, monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: 700;
        fill: #8b949e;
      }
      .label-text {
        font-family: 'Fira Code', Menlo, Monaco, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #e6edf3;
      }
      .pct-text {
        font-family: 'Fira Code', Menlo, Monaco, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #7ee787;
      }
      .hud-val {
        font-family: 'Fira Code', Menlo, Monaco, monospace;
        font-size: 11px;
        fill: #cbd5e1;
      }
      .rank-letter {
        font-family: 'Fira Code', -apple-system, sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: #00f0ff;
        text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
      }
      .pulse-dot {
        animation: pulseDot 1.5s infinite;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
    </style>
    
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Container Frame -->
  <rect x="1" y="1" width="848" height="228" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <path d="M 1 13 C 1 6.37 6.37 1 13 1 L 837 1 C 843.63 1 849 6.37 849 13 L 849 36 L 1 36 Z" fill="#161b22"/>
  <line x1="1" y1="36" x2="849" y2="36" stroke="#30363d" stroke-width="1"/>

  <text x="24" y="23" class="hud-title">// SHCODING STUDIO TELEMETRY &amp; CAPABILITIES</text>
  
  <g transform="translate(685, 23)">
    <circle cx="0" cy="-4" r="4.5" fill="#10b981" class="pulse-dot"/>
    <text x="12" y="0" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#10b981">SYSTEM ONLINE</text>
  </g>

  <!-- LEFT COLUMN: Progress Bars (Telemetry) -->
  <g transform="translate(25, 45)">
    <!-- Metric 1 -->
    <text x="0" y="24" class="label-text">Backend &amp; Microservices (FastAPI / Python)</text>
    <text x="440" y="24" text-anchor="end" class="pct-text">98%</text>
    <rect x="0" y="32" width="440" height="7" rx="3.5" fill="#21262d"/>
    <rect x="0" y="32" width="431" height="7" rx="3.5" fill="url(#cyan-grad)"/>

    <!-- Metric 2 -->
    <text x="0" y="66" class="label-text">Frontend &amp; UI Platforms (Next.js / React / TS)</text>
    <text x="440" y="66" text-anchor="end" class="pct-text">94%</text>
    <rect x="0" y="74" width="440" height="7" rx="3.5" fill="#21262d"/>
    <rect x="0" y="74" width="414" height="7" rx="3.5" fill="url(#purple-grad)"/>

    <!-- Metric 3 -->
    <text x="0" y="108" class="label-text">AI Agents, LLM Pipelines &amp; Scrapers</text>
    <text x="440" y="108" text-anchor="end" class="pct-text">99%</text>
    <rect x="0" y="116" width="440" height="7" rx="3.5" fill="#21262d"/>
    <rect x="0" y="116" width="436" height="7" rx="3.5" fill="url(#green-grad)"/>

    <!-- Metric 4 -->
    <text x="0" y="150" class="label-text">Telegram &amp; MAX Platform Bot Systems</text>
    <text x="440" y="150" text-anchor="end" class="pct-text">96%</text>
    <rect x="0" y="158" width="440" height="7" rx="3.5" fill="#21262d"/>
    <rect x="0" y="158" width="422" height="7" rx="3.5" fill="url(#amber-grad)"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="505" y1="50" x2="505" y2="215" stroke="#30363d" stroke-width="1"/>

  <!-- RIGHT COLUMN: Verification Card & Grade S+ -->
  <g transform="translate(530, 52)">
    <!-- Rank Badge Box -->
    <rect x="0" y="0" width="295" height="158" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    
    <!-- Big Circle with Grade S+ -->
    <g transform="translate(58, 79)">
      <circle cx="0" cy="0" r="38" fill="#0d1117" stroke="#00f0ff" stroke-width="2.5" opacity="0.9"/>
      <text x="0" y="13" text-anchor="middle" class="rank-letter">S+</text>
      <text x="0" y="49" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#00f0ff">TIER: SENIOR</text>
    </g>

    <!-- Specs List -->
    <g transform="translate(116, 28)">
      <text x="0" y="0" class="hud-val"><tspan fill="#60a5fa">●</tspan> Architecture: <tspan fill="#fff" font-weight="600">Clean / Async</tspan></text>
      <text x="0" y="24" class="hud-val"><tspan fill="#34d399">●</tspan> Reliability: <tspan fill="#fff" font-weight="600">99.9% Uptime</tspan></text>
      <text x="0" y="48" class="hud-val"><tspan fill="#a78bfa">●</tspan> Security: <tspan fill="#fff" font-weight="600">Zero-Leak Guard</tspan></text>
      <text x="0" y="72" class="hud-val"><tspan fill="#f59e0b">●</tspan> Turnaround: <tspan fill="#fff" font-weight="600">Fast MVP Cycle</tspan></text>
      <text x="0" y="96" class="hud-val"><tspan fill="#38bdf8">●</tspan> Support: <tspan fill="#38bdf8" font-weight="600">t.me/mazunio</tspan></text>
    </g>
  </g>
</svg>
